name: Upstream freshness

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Compare upstream main with the locked head
        run: |
          locked=$(node -p 'require("./skills-lock.json").upstream.head')
          remote=$(git ls-remote https://github.com/mattpocock/skills refs/heads/main | cut -f1)
          if [ -z "$remote" ]; then
            echo "::error::could not read refs/heads/main from https://github.com/mattpocock/skills"
            exit 1
          fi
          if [ "$remote" != "$locked" ]; then
            echo "::error::mattpocock/skills main is at $remote but skills-lock.json pins $locked: run npm run sync:skills"
            exit 1
          fi
          echo "vendored mattpocock/skills is current at $locked"
